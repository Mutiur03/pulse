# Operations whose module has not moved to its own generated interface yet.
# Add a module's tag to exclude-tags when it moves.
package: legacy
output: ../../go/internal/api/legacy/server.gen.go
generate:
  chi-server: true
output-options:
  exclude-tags: [replay, dashboards, sourcemaps, telemetry, analytics, issues, alerts, governance]
additional-imports:
  - package: github.com/Mutiur03/pulse/internal/api/gen
    alias: .
