package: oapi
output: ../../go/internal/modules/identity/adapters/httpapi/oapi/server.gen.go
# Identity handlers set cookies and Retry-After headers, so this module uses
# the chi interface instead of the strict one.
generate:
  chi-server: true
output-options:
  include-tags: [identity]
additional-imports:
  - package: github.com/Mutiur03/pulse/internal/api/gen
    alias: .
