openapi: 3.0.3
info:
  title: Pulse Query API
  version: 1.3.0
  description: >
    Read API for traces, issues, product events and funnels stored by Pulse.
    Everything under /v1 except POST /v1/auth/login and /v1/auth/signup needs
    the pulse_session cookie set by login or signup, and only returns data from projects the user is a
    member of. Mutating requests must use a JSON content type.
security:
  - session: []
servers:
  - url: http://localhost:8081
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/auth/login:
    post:
      summary: Log in with email and password
      description: Sets an HTTP-only `pulse_session` cookie on success.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: >
            Too many failed logins for this email from this address. The
            Retry-After header gives the seconds to wait.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/signup:
    post:
      summary: Create an account
      description: >
        Creates the user and their organization and logs them in by setting
        the `pulse_session` cookie. Projects are created afterwards.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/password-reset/request:
    post:
      summary: Email a password reset link
      description: >
        Always returns 204 whether or not the email has an account, so it
        cannot be used to find accounts. Limited to 5 requests per email and
        address per hour (429 after that).
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Done
        '429':
          description: Too many requests; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/password-reset/confirm:
    post:
      summary: Set a new password with a reset token
      description: >
        Tokens are single use and expire after one hour. Every existing
        session of the user is ended.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/verify-email:
    post:
      summary: Confirm the email address with the token from the verification email
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/verify-email/resend:
    post:
      summary: Send the verification email again
      operationId: resendVerification
      responses:
        '204':
          description: Done
  /v1/orgs/{org_id}/members:
    get:
      summary: Members of the organization
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{org_id}/members/{user_id}/remove:
    post:
      summary: Remove a member from the organization
      description: Owners only. The last owner cannot be removed.
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Done
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That is the last owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orgs/{org_id}/members/{user_id}/role:
    post:
      summary: Change a member's role
      description: Owners only. The last owner cannot be demoted.
      operationId: setMemberRole
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That is the last owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orgs/{org_id}/audit-log:
    get:
      summary: Security audit log of the organization
      description: Owners only. Includes logins of current members.
      operationId: listAuditLog
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          description: Only entries with a smaller id, for paging
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Newest entries first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{org_id}/invites:
    get:
      summary: Pending invites
      operationId: listInvites
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      responses:
        '200':
          description: Invites that are neither accepted, revoked nor expired
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Invite someone by email
      description: Owners only. The link expires after 7 days.
      operationId: createInvite
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteInput'
      responses:
        '201':
          description: The invite (the token is only sent by email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orgs/{org_id}/invites/{invite_id}/revoke:
    post:
      summary: Revoke a pending invite
      operationId: revokeInvite
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: invite_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Done
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/invites/lookup:
    post:
      summary: Describe an invite from its token
      operationId: lookupInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteInfo'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/invites/accept:
    post:
      summary: Accept an invite as the logged-in user
      description: The invite must be addressed to the user's email.
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The user, now in the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/logout:
    post:
      summary: End the current session
      operationId: logout
      responses:
        '204':
          description: Logged out
  /v1/auth/logout-all:
    post:
      summary: End every session of the current user, on all devices
      operationId: logoutAll
      responses:
        '200':
          description: Sessions ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/me:
    get:
      summary: Current user and their projects
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/projects:
    get:
      summary: Projects the user is a member of
      operationId: listProjects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create a project in the user's organization
      description: The creator becomes its owner and gets a first ingest key.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: The project and its ingest key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedProject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/projects/{project_id}:
    patch:
      summary: Rename a project
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/allowed-origins:
    get:
      summary: Browser origins allowed to send data with the project's ingest keys
      operationId: getAllowedOrigins
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Allowed origins; empty allows any origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedOrigins'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Replace the allowed browser origins
      description: Owners only.
      operationId: setAllowedOrigins
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowedOrigins'
      responses:
        '200':
          description: Saved origins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowedOrigins'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/keys:
    post:
      summary: Add an ingest key
      description: Existing keys stay active, so apps can move over gradually.
      operationId: createKey
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '201':
          description: The new key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: List the project's ingest keys
      operationId: listKeys
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Keys, active first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/keys/rotate:
    post:
      summary: Rotate the project's ingest key
      description: >
        Creates a new public key and revokes every previous one. Revoked keys
        stop working immediately on this gateway's cache.
      operationId: rotateKey
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '201':
          description: The new key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/keys/{key_id}/revoke:
    post:
      summary: Revoke one ingest key
      operationId: revokeKey
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - name: key_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/traces:
    get:
      summary: Search traces
      operationId: listTraces
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: service
          in: query
          description: Only traces with a span from this service.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ok, error]
        - name: min_duration_ms
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_duration_ms
          in: query
          schema:
            type: number
            minimum: 0
        - name: query
          in: query
          description: Case-insensitive match on span names.
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Most recent matching traces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/services:
    get:
      summary: Services that sent spans in the time range
      operationId: listServices
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Service names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v1/events:
    get:
      summary: Explore product events
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: event
          in: query
          schema:
            type: string
        - name: distinct_id
          in: query
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Most recent matching events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
  /v1/events/names:
    get:
      summary: Event names with counts
      operationId: listEventNames
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Event names, most frequent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventName'
  /v1/funnels/query:
    post:
      summary: Run a funnel
      description: >
        Counts users (distinct_id) reaching each step in order within the
        conversion window, using ClickHouse windowFunnel. For the users who
        dropped off after each step it reports the errors and the backend
        p95 latency seen in their sessions, next to the same numbers for
        users who went on to the next step.
      operationId: queryFunnel
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelQuery'
      responses:
        '200':
          description: Funnel result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/traces/{trace_id}:
    get:
      summary: Get a full trace
      description: >
        Returns every span of the trace (browser, backend and database) as a
        tree, with errors and product events attached to the span they
        happened in. Spans whose parent was never received are returned as
        extra roots with `orphan: true`.
      operationId: getTrace
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{1,32}$'
      responses:
        '200':
          description: Trace tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/replays:
    get:
      summary: Recorded sessions
      operationId: listReplays
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - name: has_errors
          in: query
          schema:
            type: boolean
        - name: user
          in: query
          description: Distinct id of the user.
          schema:
            type: string
        - name: url
          in: query
          description: Substring of a visited URL.
          schema:
            type: string
        - name: min_duration_ms
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayList'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/replays/{session_id}:
    get:
      summary: A recorded session with its errors and traces
      operationId: getReplay
      parameters:
        - $ref: '#/components/parameters/SessionPath'
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/replays/{session_id}/events:
    get:
      summary: All rrweb events of the session in playback order
      description: Streams the stored chunks as one JSON array.
      operationId: getReplayEvents
      parameters:
        - $ref: '#/components/parameters/SessionPath'
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: rrweb events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/issues:
    get:
      summary: List issues
      operationId: listIssues
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: service
          in: query
          schema:
            type: string
        - name: query
          in: query
          description: Case-insensitive match on title or culprit.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_seen, first_seen, count]
            default: last_seen
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/issues/{id}:
    get:
      summary: Get an issue with its most recent events
      operationId: getIssue
      parameters:
        - $ref: '#/components/parameters/IssueID'
        - name: events_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: symbolicate
          in: query
          description: >
            Resolve every event's stack again with the source maps uploaded so
            far. Events not fully mapped are always retried on view.
          schema:
            type: boolean
      responses:
        '200':
          description: Issue detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Change an issue's status
      operationId: updateIssue
      parameters:
        - $ref: '#/components/parameters/IssueID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/alerts:
    get:
      summary: List alert rules with their current state
      description: Alerting rules come first, then no-data, then OK.
      operationId: listAlerts
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create an alert rule
      operationId: createAlert
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '201':
          description: The new rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/alerts/preview:
    post:
      summary: Chart a rule's metric against its threshold
      description: >
        Buckets the metric by the rule's window over the last 24 windows (at
        most 7 days). Event-driven metrics (new_issue, issue_regression) have
        no chart and return supported false.
      operationId: previewAlert
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: The chart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/alerts/{alert_id}:
    get:
      summary: Get a rule with its recent history
      operationId: getAlert
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/AlertPath'
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a rule
      description: Changing the condition or disabling the rule resets its state to OK.
      operationId: updateAlert
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/AlertPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleInput'
      responses:
        '200':
          description: The updated rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a rule and its history
      operationId: deleteAlert
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/AlertPath'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/alerts/{alert_id}/mute:
    post:
      summary: Mute or unmute a rule's notifications
      description: >
        A muted rule keeps evaluating and recording history but sends
        nothing until the mute ends. Minutes 0 unmutes.
      operationId: muteAlert
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/AlertPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertMute'
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/alert-channels:
    get:
      summary: List notification channels
      description: Webhook signing secrets are only returned when a channel is created.
      operationId: listAlertChannels
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertChannel'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add a notification channel
      description: >
        Webhook channels get a signing secret, returned only in this response.
        Each webhook request carries X-Pulse-Signature "t=<unix>,v1=<hex>",
        where v1 is HMAC-SHA256(secret, "<unix>.<body>").
      operationId: createAlertChannel
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertChannelInput'
      responses:
        '201':
          description: The new channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/alert-channels/{channel_id}:
    delete:
      summary: Delete a channel and remove it from rules
      operationId: deleteAlertChannel
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/ChannelPath'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/alert-channels/{channel_id}/test:
    post:
      summary: Send a test notification
      operationId: testAlertChannel
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/ChannelPath'
      responses:
        '200':
          description: Delivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertChannelTest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/releases:
    get:
      summary: List the project's releases, newest first
      operationId: listReleases
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Releases with artifact counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/releases/{release}:
    get:
      summary: Get a release and its uploaded artifacts
      operationId: getRelease
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/ReleasePath'
      responses:
        '200':
          description: Release detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/releases/{release}/sourcemaps:
    post:
      summary: Upload source maps for a release
      description: >
        Authenticated with a project upload token (Authorization: Bearer pul_...),
        not a session. Each file part is one source map; its form field name is
        the URL or path of the generated file plus ".map" (for example
        "~/dist/main.js.map"). The release is created on first upload. Maps with
        a debugId are matched by it; the rest by URL.
      operationId: uploadSourcemaps
      security:
        - uploadToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/ReleasePath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties:
                type: string
                format: binary
      responses:
        '201':
          description: Stored artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BadRequest'
  /v1/projects/{project_id}/upload-tokens:
    get:
      summary: List the project's source map upload tokens
      operationId: listUploadTokens
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Tokens, active first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadToken'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create an upload token
      description: The secret is returned only in this response.
      operationId: createUploadToken
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadTokenCreate'
      responses:
        '201':
          description: The token and its secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTokenCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/upload-tokens/{token_id}/revoke:
    post:
      summary: Revoke an upload token
      operationId: revokeUploadToken
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - name: token_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The revoked token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadToken'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/metrics/names:
    get:
      summary: Metrics received in the time range
      operationId: listMetricNames
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Metric names with their type and services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricName'
  /v1/metrics/query:
    get:
      summary: Query one metric as time series
      description: >
        Buckets data points by step and aggregates them. Without agg, gauges
        average, delta sums add up, cumulative sums take the latest total and
        histograms report p95 from their buckets.
      operationId: queryMetric
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: name
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
        - name: service
          in: query
          schema:
            type: string
        - name: agg
          in: query
          schema:
            type: string
            enum: [avg, sum, min, max, count, rate, p50, p90, p95, p99]
        - name: step
          in: query
          description: Bucket size in seconds. Default fits about 60 points in the range.
          schema:
            type: integer
            minimum: 1
        - name: group_by
          in: query
          description: service.name or a data point attribute key; at most 20 series.
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/insights/trends:
    post:
      summary: Chart events over time
      description: >
        Runs each series (an event, or every event, counted as total, unique
        users, unique sessions or an aggregate of a numeric property) over
        time buckets, with property filters, an optional breakdown by a
        property (top 10 terms, the rest as $other) and an optional formula
        over the series letters (A, B, ...).
      operationId: queryTrend
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrendQuery'
      responses:
        '200':
          description: Trend result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/traces/stats:
    get:
      summary: Request volume, errors and latency of root spans over time
      operationId: traceStats
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: service
          in: query
          schema:
            type: string
        - name: interval
          in: query
          schema:
            $ref: '#/components/schemas/TrendInterval'
      responses:
        '200':
          description: Stats per bucket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceStats'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/projects/{project_id}/dashboards:
    get:
      summary: List the dashboards you can see
      description: Shared dashboards and your own private ones, most recently updated first.
      operationId: listDashboards
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Dashboards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dashboard'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a dashboard
      operationId: createDashboard
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardInput'
      responses:
        '201':
          description: The new dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/dashboards/{dashboard_id}:
    get:
      summary: Get a dashboard
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/DashboardPath'
      responses:
        '200':
          description: The dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a dashboard
      description: Allowed for its creator, and for project owners when it is shared.
      operationId: updateDashboard
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/DashboardPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardInput'
      responses:
        '200':
          description: The updated dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a dashboard
      operationId: deleteDashboard
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - $ref: '#/components/parameters/DashboardPath'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pulse_session
    uploadToken:
      type: http
      scheme: bearer
  parameters:
    AlertPath:
      name: alert_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChannelPath:
      name: channel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionPath:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    OrgPath:
      name: org_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReleasePath:
      name: release
      in: path
      required: true
      schema:
        type: string
        maxLength: 200
    DashboardPath:
      name: dashboard_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProjectPath:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    From:
      name: from
      in: query
      description: Start of the time range. Default 24 hours ago.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: End of the time range. Default now.
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProjectID:
      name: project_id
      in: query
      description: Defaults to the user's first project.
      schema:
        type: integer
        format: int64
    IssueID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Only project owners can do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not logged in or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TrendInterval:
      description: Bucket size of a time series.
      type: string
      enum: [hour, day, week, month]
    PropertyFilter:
      type: object
      required: [property, op]
      properties:
        property:
          type: string
          description: distinct_id, session_id, event, or a key of the event properties (e.g. $pathname).
        op:
          type: string
          enum: [eq, neq, contains, not_contains, is_set, is_not_set, gt, lt]
        value:
          type: string
    TrendSeriesInput:
      type: object
      properties:
        event:
          type: string
          description: Event name; empty counts every event.
        math:
          type: string
          enum: [total, unique_users, unique_sessions, sum, avg, min, max, p95]
        property:
          type: string
          description: Numeric property for sum, avg, min, max and p95.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/PropertyFilter'
    TrendQuery:
      type: object
      required: [series]
      properties:
        series:
          type: array
          items:
            $ref: '#/components/schemas/TrendSeriesInput'
        filters:
          type: array
          description: Filters applied to every series.
          items:
            $ref: '#/components/schemas/PropertyFilter'
        breakdown:
          type: string
        interval:
          $ref: '#/components/schemas/TrendInterval'
        formula:
          type: string
          description: Arithmetic over series letters, e.g. "A / B * 100". Replaces the series in the result.
        from:
          type: string
          format: date-time
          description: Default 7 days ago.
        to:
          type: string
          format: date-time
    TrendSeriesResult:
      type: object
      required: [label, index, breakdown, data, total]
      properties:
        label:
          type: string
        index:
          type: integer
          description: Series index, -1 for the formula.
        breakdown:
          type: string
        data:
          type: array
          items:
            type: number
            format: double
        total:
          type: number
          format: double
          description: Over the whole range (true unique counts for unique math).
    TrendResult:
      type: object
      required: [interval, from, to, buckets, series]
      properties:
        interval:
          $ref: '#/components/schemas/TrendInterval'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        buckets:
          type: array
          items:
            type: string
            format: date-time
        series:
          type: array
          items:
            $ref: '#/components/schemas/TrendSeriesResult'
    TraceStatsPoint:
      type: object
      required: [t, requests, errors, error_rate, p50_ms, p95_ms]
      properties:
        t:
          type: string
          format: date-time
        requests:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        error_rate:
          type: number
          format: double
        p50_ms:
          type: number
          format: double
        p95_ms:
          type: number
          format: double
    TraceStats:
      type: object
      required: [interval, points, requests, errors]
      properties:
        interval:
          $ref: '#/components/schemas/TrendInterval'
        service:
          type: string
        requests:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        points:
          type: array
          items:
            $ref: '#/components/schemas/TraceStatsPoint'
    DashboardWidget:
      type: object
      required: [id, kind]
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
          enum: [trend, funnel, metric, traces]
        width:
          type: integer
          description: 1 (half row) or 2 (full row).
        query:
          type: object
          additionalProperties: true
          description: >
            The saved query: a TrendQuery plus display for trend, a
            FunnelQuery for funnel, {name, agg, group_by} for metric and
            {service} for traces.
    DashboardInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        shared:
          type: boolean
          description: Visible to everyone who can read the project.
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'
    Dashboard:
      type: object
      required: [id, project_id, name, description, shared, created_by, creator_name, can_edit, widgets, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        shared:
          type: boolean
        created_by:
          type: integer
          format: int64
        creator_name:
          type: string
        can_edit:
          type: boolean
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
          description: At least 10 characters.
        name:
          type: string
        invite_token:
          type: string
          description: Join the inviting organization instead of creating one.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    Org:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
    Member:
      type: object
      required: [user_id, email, name, role, joined_at]
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
        joined_at:
          type: string
          format: date-time
    RoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, member]
    LogoutAllResult:
      type: object
      required: [sessions_ended]
      properties:
        sessions_ended:
          type: integer
          format: int64
    AllowedOrigins:
      type: object
      required: [origins]
      properties:
        origins:
          type: array
          description: Origins such as https://app.example.com or https://*.example.com
          items:
            type: string
    AuditEntry:
      type: object
      required: [id, created_at, action, actor_email, target, ip, details]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        action:
          type: string
        actor_id:
          type: integer
          format: int64
        actor_email:
          type: string
        project_id:
          type: integer
          format: int64
        target:
          type: string
        ip:
          type: string
        details:
          type: object
          additionalProperties: true
