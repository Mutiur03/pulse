openapi: 3.0.3
info:
  title: Pulse Query API
  version: 1.2.0
  description: >
    Read API for traces, issues, product events and funnels stored by Pulse.
    Everything under /v1 except POST /v1/auth/login and /v1/auth/signup needs
    the pulse_session cookie set by login or signup, and only returns data from projects the user is a
    member of. Mutating requests must use a JSON content type.
security:
  - session: []
servers:
  - url: http://localhost:8081
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/auth/login:
    post:
      summary: Log in with email and password
      description: Sets an HTTP-only `pulse_session` cookie on success.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: >
            Too many failed logins for this email from this address. The
            Retry-After header gives the seconds to wait.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/signup:
    post:
      summary: Create an account
      description: >
        Creates the user and their organization and logs them in by setting
        the `pulse_session` cookie. Projects are created afterwards.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/password-reset/request:
    post:
      summary: Email a password reset link
      description: >
        Always returns 204 whether or not the email has an account, so it
        cannot be used to find accounts. Limited to 5 requests per email and
        address per hour (429 after that).
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Done
        '429':
          description: Too many requests; see Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/password-reset/confirm:
    post:
      summary: Set a new password with a reset token
      description: >
        Tokens are single use and expire after one hour. Every existing
        session of the user is ended.
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/verify-email:
    post:
      summary: Confirm the email address with the token from the verification email
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/verify-email/resend:
    post:
      summary: Send the verification email again
      operationId: resendVerification
      responses:
        '204':
          description: Done
  /v1/orgs/{org_id}/members:
    get:
      summary: Members of the organization
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{org_id}/members/{user_id}/remove:
    post:
      summary: Remove a member from the organization
      description: Owners only. The last owner cannot be removed.
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Done
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That is the last owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orgs/{org_id}/invites:
    get:
      summary: Pending invites
      operationId: listInvites
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      responses:
        '200':
          description: Invites that are neither accepted, revoked nor expired
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invite'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Invite someone by email
      description: Owners only. The link expires after 7 days.
      operationId: createInvite
      parameters:
        - $ref: '#/components/parameters/OrgPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteInput'
      responses:
        '201':
          description: The invite (the token is only sent by email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/orgs/{org_id}/invites/{invite_id}/revoke:
    post:
      summary: Revoke a pending invite
      operationId: revokeInvite
      parameters:
        - $ref: '#/components/parameters/OrgPath'
        - name: invite_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Done
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/invites/lookup:
    post:
      summary: Describe an invite from its token
      operationId: lookupInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteInfo'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/invites/accept:
    post:
      summary: Accept an invite as the logged-in user
      description: The invite must be addressed to the user's email.
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: The user, now in the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/logout:
    post:
      summary: End the current session
      operationId: logout
      responses:
        '204':
          description: Logged out
  /v1/auth/me:
    get:
      summary: Current user and their projects
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/projects:
    get:
      summary: Projects the user is a member of
      operationId: listProjects
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Create a project in the user's organization
      description: The creator becomes its owner and gets a first ingest key.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: The project and its ingest key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedProject'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/projects/{project_id}:
    patch:
      summary: Rename a project
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/keys:
    post:
      summary: Add an ingest key
      description: Existing keys stay active, so apps can move over gradually.
      operationId: createKey
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '201':
          description: The new key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: List the project's ingest keys
      operationId: listKeys
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '200':
          description: Keys, active first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/keys/rotate:
    post:
      summary: Rotate the project's ingest key
      description: >
        Creates a new public key and revokes every previous one. Revoked keys
        stop working immediately on this gateway's cache.
      operationId: rotateKey
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
      responses:
        '201':
          description: The new key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/projects/{project_id}/keys/{key_id}/revoke:
    post:
      summary: Revoke one ingest key
      operationId: revokeKey
      parameters:
        - $ref: '#/components/parameters/ProjectPath'
        - name: key_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/traces:
    get:
      summary: Search traces
      operationId: listTraces
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: service
          in: query
          description: Only traces with a span from this service.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ok, error]
        - name: min_duration_ms
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_duration_ms
          in: query
          schema:
            type: number
            minimum: 0
        - name: query
          in: query
          description: Case-insensitive match on span names.
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Most recent matching traces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/services:
    get:
      summary: Services that sent spans in the time range
      operationId: listServices
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Service names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /v1/events:
    get:
      summary: Explore product events
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: event
          in: query
          schema:
            type: string
        - name: distinct_id
          in: query
          schema:
            type: string
        - name: session_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Most recent matching events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
  /v1/events/names:
    get:
      summary: Event names with counts
      operationId: listEventNames
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Event names, most frequent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventName'
  /v1/funnels/query:
    post:
      summary: Run a funnel
      description: >
        Counts users (distinct_id) reaching each step in order within the
        conversion window, using ClickHouse windowFunnel. For the users who
        dropped off after each step it reports the errors and the backend
        p95 latency seen in their sessions, next to the same numbers for
        users who went on to the next step.
      operationId: queryFunnel
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelQuery'
      responses:
        '200':
          description: Funnel result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/traces/{trace_id}:
    get:
      summary: Get a full trace
      description: >
        Returns every span of the trace (browser, backend and database) as a
        tree, with errors and product events attached to the span they
        happened in. Spans whose parent was never received are returned as
        extra roots with `orphan: true`.
      operationId: getTrace
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{1,32}$'
      responses:
        '200':
          description: Trace tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/issues:
    get:
      summary: List issues
      operationId: listIssues
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: service
          in: query
          schema:
            type: string
        - name: query
          in: query
          description: Case-insensitive match on title or culprit.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_seen, first_seen, count]
            default: last_seen
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/issues/{id}:
    get:
      summary: Get an issue with its most recent events
      operationId: getIssue
      parameters:
        - $ref: '#/components/parameters/IssueID'
        - name: events_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Issue detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Change an issue's status
      operationId: updateIssue
      parameters:
        - $ref: '#/components/parameters/IssueID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pulse_session
  parameters:
    OrgPath:
      name: org_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProjectPath:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    From:
      name: from
      in: query
      description: Start of the time range. Default 24 hours ago.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: End of the time range. Default now.
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProjectID:
      name: project_id
      in: query
      description: Defaults to the user's first project.
      schema:
        type: integer
        format: int64
    IssueID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Only project owners can do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not logged in or bad credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
          description: At least 10 characters.
        name:
          type: string
        invite_token:
          type: string
          description: Join the inviting organization instead of creating one.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    Org:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
    Member:
      type: object
      required: [user_id, email, name, role, joined_at]
      properties:
        user_id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
        joined_at:
          type: string
          format: date-time
    InviteInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
        role:
          type: string
          enum: [owner, member]
    Invite:
      type: object
      required: [id, org_id, email, role, created_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
        org_id:
          type: integer
          format: int64
        email:
          type: string
        role:
          type: string
          enum: [owner, member]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InviteInfo:
      type: object
      required: [org_id, org_name, email, role, inviter]
      properties:
        org_id:
          type: integer
          format: int64
        org_name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, member]
        inviter:
          type: string
    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: 1 to 80 characters.
        org_id:
          type: integer
          format: int64
          description: Organization for a new project; defaults to the user's first. Ignored on rename.
    CreatedProject:
      type: object
      required: [project, key]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        key:
          $ref: '#/components/schemas/ApiKey'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    User:
      type: object
      required: [id, email, name, email_verified]
      properties:
        email_verified:
          type: boolean
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
    Project:
      type: object
      required: [id, name, role, org_id]
      properties:
        org_id:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
    Me:
      type: object
      required: [user, projects, orgs]
      properties:
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/Org'
        user:
          $ref: '#/components/schemas/User'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    ApiKey:
      type: object
      required: [id, project_id, public_key, rate_limit_per_sec, created_at]
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        public_key:
          type: string
        rate_limit_per_sec:
          type: integer
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    TraceSummary:
      type: object
      required: [trace_id, root_name, root_service, services, start_time, duration_ns, span_count, error_count, has_browser]
      properties:
        trace_id:
          type: string
        root_name:
          type: string
        root_service:
          type: string
        services:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        duration_ns:
          type: integer
          format: int64
        span_count:
          type: integer
        error_count:
          type: integer
        has_browser:
          type: boolean
        http_status:
          type: integer
    TraceList:
      type: object
      required: [traces]
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceSummary'
    EventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProductEvent'
    EventName:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64
    FunnelQuery:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          minItems: 2
          maxItems: 5
          items:
            type: string
        window_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
          default: 3600
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    CohortHealth:
      type: object
      description: Backend health in the sessions of a group of users.
      required: [users, sessions, error_sessions, p95_latency_ms, top_errors]
      properties:
        users:
          type: integer
          format: int64
        sessions:
          type: integer
          format: int64
        error_sessions:
          type: integer
          format: int64
          description: Sessions with at least one error.
        p95_latency_ms:
          type: number
          description: p95 duration of backend server spans in these sessions.
        top_errors:
          type: array
          items:
            $ref: '#/components/schemas/FunnelError'
    FunnelError:
      type: object
      required: [issue_id, title, exception_type, service_name, users, count]
      properties:
        issue_id:
          type: integer
          format: int64
        title:
          type: string
        exception_type:
          type: string
        service_name:
          type: string
        users:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
    FunnelStep:
      type: object
      required: [event, users, conversion_from_previous, conversion_overall]
      properties:
        event:
          type: string
        users:
          type: integer
          format: int64
          description: Users who reached this step.
        conversion_from_previous:
          type: number
        conversion_overall:
          type: number
        dropped:
          description: Users who reached this step but not the next one.
          allOf:
            - $ref: '#/components/schemas/CohortHealth'
        continued:
          description: Users who reached this step and the next one.
          allOf:
            - $ref: '#/components/schemas/CohortHealth'
    FunnelResult:
      type: object
      required: [steps, window_seconds, from, to]
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStep'
        window_seconds:
          type: integer
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Trace:
      type: object
      required: [trace_id, start_time, duration_ns, span_count, error_count, services, roots, events]
      properties:
        trace_id:
          type: string
        start_time:
          type: string
          format: date-time
        duration_ns:
          type: integer
          format: int64
        span_count:
          type: integer
        error_count:
          type: integer
        services:
          type: array
          items:
            type: string
        roots:
          type: array
          items:
            $ref: '#/components/schemas/SpanNode'
        events:
          description: Product events on this trace not tied to a received span.
          type: array
          items:
            $ref: '#/components/schemas/ProductEvent'
    SpanSource:
      type: string
      enum: [browser, backend, database]
    SpanNode:
      type: object
      required: [span_id, parent_span_id, name, kind, service_name, source, start_time, duration_ns, status_code, depth, orphan, children, errors, events]
      properties:
        span_id:
          type: string
        parent_span_id:
          type: string
        name:
          type: string
        kind:
          type: string
        service_name:
          type: string
        source:
          $ref: '#/components/schemas/SpanSource'
        start_time:
          type: string
          format: date-time
        duration_ns:
          type: integer
          format: int64
        status_code:
          type: string
        status_message:
          type: string
        http_route:
          type: string
        http_status:
          type: integer
        db_system:
          type: string
        db_statement:
          type: string
        session_id:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        span_events:
          type: array
          items:
            $ref: '#/components/schemas/SpanEvent'
        depth:
          type: integer
        orphan:
          type: boolean
          description: True when the span's parent is not part of the trace data.
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpanNode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorOccurrence'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProductEvent'
    SpanEvent:
      type: object
      required: [name, time]
      properties:
        name:
          type: string
        time:
          type: string
          format: date-time
        attributes:
          type: object
          additionalProperties:
            type: string
    ErrorOccurrence:
      type: object
      required: [timestamp, issue_id, exception_type, message, trace_id, span_id, service_name, platform]
      properties:
        timestamp:
          type: string
          format: date-time
        issue_id:
          type: integer
          format: int64
        exception_type:
          type: string
        message:
          type: string
        stack:
          type: string
        culprit:
          type: string
        trace_id:
          type: string
        span_id:
          type: string
        service_name:
          type: string
        platform:
          type: string
        session_id:
          type: string
        distinct_id:
          type: string
        url:
          type: string
    ProductEvent:
      type: object
      required: [event, timestamp, distinct_id, session_id, span_id, properties]
      properties:
        event:
          type: string
        timestamp:
          type: string
          format: date-time
        distinct_id:
          type: string
        session_id:
          type: string
        span_id:
          type: string
        trace_id:
          type: string
        properties:
          type: object
          additionalProperties: true
    IssueStatus:
      type: string
      enum: [unresolved, resolved, ignored]
    Issue:
      type: object
      required: [id, project_id, fingerprint, title, exception_type, culprit, platform, service_name, status, first_seen, last_seen, count, sample_trace_id, times_regressed]
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        fingerprint:
          type: string
        title:
          type: string
        exception_type:
          type: string
        culprit:
          type: string
        platform:
          type: string
        service_name:
          type: string
        status:
          $ref: '#/components/schemas/IssueStatus'
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        count:
          type: integer
          format: int64
        sample_trace_id:
          type: string
        sample_span_id:
          type: string
        resolved_at:
          type: string
          format: date-time
        times_regressed:
          type: integer
        trend:
          description: Occurrences per hour over the last 24 hours, oldest first (list only).
          type: array
          items:
            type: integer
            format: int64
    IssueList:
      type: object
      required: [issues, total, limit, offset]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
    IssueDetail:
      type: object
      required: [issue, recent_events]
      properties:
        issue:
          $ref: '#/components/schemas/Issue'
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/ErrorOccurrence'
    IssueUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/IssueStatus'
