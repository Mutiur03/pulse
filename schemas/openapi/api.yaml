openapi: 3.0.3
info:
  title: Pulse Query API
  version: 1.1.0
  description: Read API for traces, issues and product events stored by Pulse.
servers:
  - url: http://localhost:8081
    description: Local development
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/traces/{trace_id}:
    get:
      summary: Get a full trace
      description: >
        Returns every span of the trace (browser, backend and database) as a
        tree, with errors and product events attached to the span they
        happened in. Spans whose parent was never received are returned as
        extra roots with `orphan: true`.
      operationId: getTrace
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{1,32}$'
      responses:
        '200':
          description: Trace tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/issues:
    get:
      summary: List issues
      operationId: listIssues
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/IssueStatus'
        - name: service
          in: query
          schema:
            type: string
        - name: query
          in: query
          description: Case-insensitive match on title or culprit.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_seen, first_seen, count]
            default: last_seen
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/issues/{id}:
    get:
      summary: Get an issue with its most recent events
      operationId: getIssue
      parameters:
        - $ref: '#/components/parameters/IssueID'
        - name: events_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Issue detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Change an issue's status
      operationId: updateIssue
      parameters:
        - $ref: '#/components/parameters/IssueID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdate'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProjectID:
      name: project_id
      in: query
      schema:
        type: integer
        format: int64
        default: 1
    IssueID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Trace:
      type: object
      required: [trace_id, start_time, duration_ns, span_count, error_count, services, roots, events]
      properties:
        trace_id:
          type: string
        start_time:
          type: string
          format: date-time
        duration_ns:
          type: integer
          format: int64
        span_count:
          type: integer
        error_count:
          type: integer
        services:
          type: array
          items:
            type: string
        roots:
          type: array
          items:
            $ref: '#/components/schemas/SpanNode'
        events:
          description: Product events on this trace not tied to a received span.
          type: array
          items:
            $ref: '#/components/schemas/ProductEvent'
    SpanSource:
      type: string
      enum: [browser, backend, database]
    SpanNode:
      type: object
      required: [span_id, parent_span_id, name, kind, service_name, source, start_time, duration_ns, status_code, depth, orphan, children, errors, events]
      properties:
        span_id:
          type: string
        parent_span_id:
          type: string
        name:
          type: string
        kind:
          type: string
        service_name:
          type: string
        source:
          $ref: '#/components/schemas/SpanSource'
        start_time:
          type: string
          format: date-time
        duration_ns:
          type: integer
          format: int64
        status_code:
          type: string
        status_message:
          type: string
        http_route:
          type: string
        http_status:
          type: integer
        db_system:
          type: string
        db_statement:
          type: string
        session_id:
          type: string
        depth:
          type: integer
        orphan:
          type: boolean
          description: True when the span's parent is not part of the trace data.
        children:
          type: array
          items:
            $ref: '#/components/schemas/SpanNode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorOccurrence'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ProductEvent'
    ErrorOccurrence:
      type: object
      required: [timestamp, issue_id, exception_type, message, trace_id, span_id, service_name, platform]
      properties:
        timestamp:
          type: string
          format: date-time
        issue_id:
          type: integer
          format: int64
        exception_type:
          type: string
        message:
          type: string
        stack:
          type: string
        culprit:
          type: string
        trace_id:
          type: string
        span_id:
          type: string
        service_name:
          type: string
        platform:
          type: string
        session_id:
          type: string
        distinct_id:
          type: string
        url:
          type: string
    ProductEvent:
      type: object
      required: [event, timestamp, distinct_id, session_id, span_id, properties]
      properties:
        event:
          type: string
        timestamp:
          type: string
          format: date-time
        distinct_id:
          type: string
        session_id:
          type: string
        span_id:
          type: string
        properties:
          type: object
          additionalProperties: true
    IssueStatus:
      type: string
      enum: [unresolved, resolved, ignored]
    Issue:
      type: object
      required: [id, project_id, fingerprint, title, exception_type, culprit, platform, service_name, status, first_seen, last_seen, count, sample_trace_id, times_regressed]
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        fingerprint:
          type: string
        title:
          type: string
        exception_type:
          type: string
        culprit:
          type: string
        platform:
          type: string
        service_name:
          type: string
        status:
          $ref: '#/components/schemas/IssueStatus'
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        count:
          type: integer
          format: int64
        sample_trace_id:
          type: string
        sample_span_id:
          type: string
        resolved_at:
          type: string
          format: date-time
        times_regressed:
          type: integer
    IssueList:
      type: object
      required: [issues, total, limit, offset]
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
    IssueDetail:
      type: object
      required: [issue, recent_events]
      properties:
        issue:
          $ref: '#/components/schemas/Issue'
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/ErrorOccurrence'
    IssueUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/IssueStatus'
