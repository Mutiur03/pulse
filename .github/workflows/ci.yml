name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PULSE_TEST_POSTGRES: postgres://test:test@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: Download dependencies
        working-directory: go
        run: go mod download

      - name: Run tests
        working-directory: go
        run: go test -race ./...

      - name: Vet and build the Go demo API
        working-directory: examples/go-demo-api
        run: go vet ./... && go build ./...

      - name: Build services
        working-directory: go
        run: |
          go build -o bin/ingest-gateway ./cmd/ingest-gateway
          go build -o bin/stream-processor ./cmd/stream-processor
          go build -o bin/query-api ./cmd/query-api
          go build -o bin/alerting-worker ./cmd/alerting-worker
          go build -o bin/governance-worker ./cmd/governance-worker
          go build -o bin/platform ./cmd/platform

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: go

      - name: Complexity gate
        working-directory: go
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          files=$(find . -name '*.go' -not -path './internal/api/gen/*' -not -name '*_test.go')
          echo "Functions over 20 (warning):"
          "$(go env GOPATH)/bin/gocyclo" -over 20 $files || true
          # Fail only when a function goes past the ceiling. Lower it as
          # hotspots are split.
          "$(go env GOPATH)/bin/gocyclo" -over 40 $files

  security-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go/go.sum
            examples/go-demo-api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Fails on any known vulnerability reachable from our code.
      - name: govulncheck (services)
        working-directory: go
        run: govulncheck ./...

      - name: govulncheck (Go demo API)
        working-directory: examples/go-demo-api
        run: govulncheck ./...

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails on high or critical advisories. Ignored advisories without a
      # fix are listed in package.json (pnpm.auditConfig) with the reason in
      # docs/SECURITY.md.
      - name: pnpm audit
        run: pnpm audit --audit-level high

  codegen-check:
    name: Generated Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: Install oapi-codegen
        run: go install github.com/deepmap/oapi-codegen/cmd/oapi-codegen@v1.16.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate code
        run: make generate

      - name: Check for changes
        run: |
          if ! git diff --exit-code go/internal/api/gen/ packages/api-client/src/generated/; then
            echo "Generated code is out of date. Run 'make generate' and commit the changes."
            exit 1
          fi

  typescript-check:
    name: TypeScript Build and SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck SDK
        run: pnpm --filter @pulse/browser typecheck

      - name: Test SDK
        run: pnpm --filter @pulse/browser test

      - name: Test Vite plugin
        run: pnpm --filter @pulse/vite-plugin typecheck && pnpm --filter @pulse/vite-plugin test

      - name: Build all packages
        run: pnpm -r build

      - name: SDK bundle size
        run: pnpm --filter @pulse/browser size | tee -a "$GITHUB_STEP_SUMMARY"

  deploy-check:
    name: Deployment Config Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform

      - name: Lint and validate the Helm chart
        run: |
          helm lint deploy/helm
          helm template pulse deploy/helm | kubeconform -strict -summary -
          helm template pulse deploy/helm --set ingress.enabled=true --set metrics.serviceMonitor.enabled=true \
            --set existingSecret=pulse-secrets | kubeconform -strict -summary -skip ServiceMonitor -

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3

      - name: Validate Terraform
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Check Prometheus rules and the Grafana dashboard
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m" --entrypoint promtool prom/prometheus:v3.5.0 check rules /m/alerts.yml
          python3 -m json.tool deploy/monitoring/grafana/dashboards/pulse-overview.json > /dev/null

      - name: Check backup and load scripts
        run: bash -n tools/backup/*.sh deploy/migrate/migrate.sh load/run.sh

      - name: Build the migration image
        run: docker build -f deploy/migrate/Dockerfile -t pulse-migrate:ci .

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go services
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/compose/Dockerfile.go
          target: ingest-gateway
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/compose/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E Stack, Seed and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @pulse/web exec playwright install --with-deps chromium

      - name: Start stack
        working-directory: deploy/compose
        run: docker compose --profile demo up -d --build --wait --wait-timeout 300

      - name: Run smoke test
        env:
          DEMO_API_URL: http://localhost:8090
        run: ./tools/smoke-test.sh

      - name: OTLP gRPC smoke with telemetrygen
        run: ./tools/otlp-grpc-smoke.sh

      - name: Funnel and alert SQL against ClickHouse
        working-directory: go
        env:
          PULSE_TEST_CLICKHOUSE: localhost:9000
        run: go test ./internal/store/ch/ -run ClickHouse -v

      - name: Seed demo traffic through the SDK and Go demo API
        run: |
          pnpm --filter @pulse/browser build
          pnpm --filter @pulse/browser-demo build
          (cd examples/browser-demo && PORT=5173 node server.mjs > /tmp/demo.log 2>&1 &)
          for i in $(seq 30); do curl -fs http://localhost:5173 >/dev/null && break; sleep 1; done
          SEED_USERS=40 pnpm --filter @pulse/web seed
          sleep 10

      - name: Playwright e2e
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens
        run: |
          mkdir -p "$SCREENSHOT_DIR"
          pnpm --filter @pulse/web e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/compose
        run: |
          docker compose --profile demo ps -a
          docker compose --profile demo logs --no-color --tail=200

      - name: Stop stack
        if: always()
        working-directory: deploy/compose
        run: docker compose --profile demo down -v
