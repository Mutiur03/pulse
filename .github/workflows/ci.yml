name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Download dependencies
        working-directory: go
        run: go mod download

      - name: Run tests
        working-directory: go
        run: go test -v ./...

      - name: Build services
        working-directory: go
        run: |
          go build -o bin/ingest-gateway ./cmd/ingest-gateway
          go build -o bin/stream-processor ./cmd/stream-processor
          go build -o bin/query-api ./cmd/query-api
          go build -o bin/alerting-worker ./cmd/alerting-worker
          go build -o bin/platform ./cmd/platform

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: go

  codegen-check:
    name: Generated Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Install oapi-codegen
        run: go install github.com/deepmap/oapi-codegen/cmd/oapi-codegen@v1.16.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate code
        run: make generate

      - name: Check for changes
        run: |
          if ! git diff --exit-code go/internal/api/gen/ packages/api-client/src/generated/; then
            echo "Generated code is out of date. Run 'make generate' and commit the changes."
            exit 1
          fi

  typescript-check:
    name: TypeScript Placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder
        run: echo "TypeScript packages will be built via Docker in docker-build job"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go services
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/compose/Dockerfile.go
          target: ingest-gateway
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/compose/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E Stack Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        working-directory: deploy/compose
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Run smoke test
        run: ./tools/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        working-directory: deploy/compose
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v
