version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # plus security checks.
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # Integer conversions between ids, counts and ClickHouse unsigned
        # columns are bounded by the data model.
        - G115
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Style-only quick fixes.
        - -QF1001
        - -QF1003
  exclusions:
    generated: lax
    rules:
      # Tests use fixed fake secrets, local servers and temp files.
      - path: _test\.go
        linters: [gosec]
      # The CLI reads, writes and uploads to the paths and URL its user names.
      - path: cmd/pulse-cli/
        text: "G304|G122|G704"
