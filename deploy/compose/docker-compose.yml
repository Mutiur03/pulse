services:
  # Infrastructure
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    hostname: clickhouse
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./schemas/clickhouse:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schemas/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: minio
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001" --address ":9002"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application services
  ingest-gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: ingest-gateway
    container_name: ingest-gateway
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: ingest-gateway
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      INGEST_GATEWAY_PORT: 8080
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  stream-processor:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: stream-processor
    container_name: stream-processor
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: stream-processor
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  query-api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: query-api
    container_name: query-api
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: query-api
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      QUERY_API_PORT: 8081
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  alerting-worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: alerting-worker
    container_name: alerting-worker
    ports:
      - "8083:8083"
    environment:
      SERVICE_NAME: alerting-worker
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    container_name: web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    depends_on:
      - query-api
    restart: unless-stopped

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  redis-data:
  minio-data:
