services:
  # Infrastructure
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:19092"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    hostname: clickhouse
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  # Applies every schemas/clickhouse/*.sql file in order on each startup.
  # All statements are idempotent (IF NOT EXISTS), so reruns are safe.
  clickhouse-migrate:
    image: clickhouse/clickhouse-server:24.10
    container_name: clickhouse-migrate
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for f in $$(ls /migrations/*.sql | sort); do
          echo "applying $$f"
          clickhouse-client --host clickhouse --multiquery < "$$f"
        done
        echo "clickhouse migrations applied"
    volumes:
      - ../../schemas/clickhouse:/migrations:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies schemas/postgres/*.sql in order on every startup (idempotent).
  postgres-migrate:
    image: postgres:16-alpine
    container_name: postgres-migrate
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for f in $$(ls /migrations/*.sql | sort); do
          echo "applying $$f"
          psql -v ON_ERROR_STOP=1 -q -f "$$f"
        done
        echo "postgres migrations applied"
        if [ -d /seed ]; then
          for f in $$(ls /seed/*.sql | sort); do
            echo "seeding $$f"
            psql -v ON_ERROR_STOP=1 -q -f "$$f"
          done
        fi
    environment:
      PGHOST: postgres
      PGUSER: platform
      PGPASSWORD: platform
      PGDATABASE: platform
    volumes:
      - ../../schemas/postgres:/migrations:ro
      # Dev-only demo user and ingest key; remove this mount outside local dev.
      - ./seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage for replays and source maps. Not needed for the core
  # event/trace pipeline, so it only starts with `--profile objectstore`.
  # Set MINIO_IMAGE if the default tag is not pullable from your registry.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    profiles: ["objectstore"]
    hostname: minio
    container_name: minio
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001" --address ":9002"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application services
  ingest-gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: ingest-gateway
    container_name: ingest-gateway
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: ingest-gateway
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      INGEST_GATEWAY_PORT: 8080
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  stream-processor:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: stream-processor
    container_name: stream-processor
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: stream-processor
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  query-api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: query-api
    container_name: query-api
    ports:
      - "8081:8081"
    environment:
      # Local stack is plain HTTP; keep the default (true) behind HTTPS.
      COOKIE_SECURE: "false"
      SERVICE_NAME: query-api
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
      QUERY_API_PORT: 8081
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  alerting-worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.go
      target: alerting-worker
    container_name: alerting-worker
    ports:
      - "8083:8083"
    environment:
      SERVICE_NAME: alerting-worker
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_ADDR: clickhouse:9000
      POSTGRES_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Example backend for examples/browser-demo. Start with --profile demo.
  go-demo-api:
    profiles: ["demo"]
    build:
      context: ../../examples/go-demo-api
    container_name: go-demo-api
    ports:
      - "8090:8090"
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://ingest-gateway:8080/v1/traces
      OTEL_SERVICE_NAME: go-demo-api
      OTEL_EXPORTER_OTLP_HEADERS: X-Pulse-Key=pk_dev_local_0123456789abcdef
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    depends_on:
      ingest-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    container_name: web
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      # Server-side only: the app proxies /api/* to the query API.
      QUERY_API_URL: http://query-api:8081
    depends_on:
      query-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  redis-data:
  minio-data:
