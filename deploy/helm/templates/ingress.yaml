{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pulse.fullname" . }}
  labels: {{- include "pulse.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pulse.fullname" . }}-web
                port: {name: http}
    - host: {{ .Values.ingress.ingestHost | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "pulse.fullname" . }}-ingest-gateway
                port: {name: http}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "pulse.fullname" . }}-ingest-gateway
                port: {name: http}
{{- end }}
