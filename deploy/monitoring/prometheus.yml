# Scrapes every Pulse Go service. Targets are the compose service names;
# the Helm chart adds prometheus.io/* pod annotations instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ingest-gateway
    static_configs:
      - targets: ["ingest-gateway:9101"]
  - job_name: query-api
    static_configs:
      - targets: ["query-api:9102"]
  - job_name: stream-processor
    static_configs:
      - targets: ["stream-processor:8082"]
  - job_name: alerting-worker
    static_configs:
      - targets: ["alerting-worker:8083"]
  - job_name: governance-worker
    static_configs:
      - targets: ["governance-worker:8084"]
