groups:
  - name: pulse
    rules:
      - alert: PulseServiceDown
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.job }} is not answering /metrics"
      - alert: PulseIngestProduceErrors
        expr: sum(rate(pulse_ingest_produce_errors_total[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: The ingest gateway cannot write to Kafka; clients receive 503
      - alert: PulseProcessingDelayHigh
        # Only while batches are flowing: the gauge keeps its last value when idle.
        expr: |
          max(pulse_processor_delay_seconds) > 120
            and on() (time() - max(pulse_processor_last_batch_timestamp_seconds)) < 300
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Data reaches ClickHouse {{ $value | humanizeDuration }} after ingest"
      - alert: PulseClickHouseWriteErrors
        expr: sum(rate(pulse_processor_write_errors_total[5m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: The stream processor is failing to write to ClickHouse
      - alert: PulseQueryAPIErrors
        expr: |
          sum(rate(pulse_http_requests_total{service="query-api",code=~"5.."}[5m]))
            / clamp_min(sum(rate(pulse_http_requests_total{service="query-api"}[5m])), 1e-9) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of query API requests fail
      - alert: PulseQueryAPISlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(pulse_http_request_duration_seconds_bucket{service="query-api"}[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Query API p95 latency is above 2s
